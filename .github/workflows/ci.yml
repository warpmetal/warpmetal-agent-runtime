name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - name: Verify and test
        run: |
          set -eu
          test -z "$(gofmt -l .)"
          sh -n packaging/install/install.sh
          sh -n packaging/install/warpmetal-apparmor-policy.sh
          sh -n packaging/apparmor/nested-private-procfs-oracle.sh
          sh -n packaging/install/coexistence_container_test.sh
          sh packaging/apparmor/profile_test.sh
          sh packaging/install/apparmor_policy_test.sh
          sh packaging/install/install_test.sh
          go test -race ./...
          go vet ./...

  container-coexistence:
    name: Existing Docker package gate / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Debian 12
            image: debian:12
          - name: AlmaLinux 9
            image: almalinux:9
          - name: Rocky Linux 9
            image: rockylinux:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve nine Docker workloads through dependency installation
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            "${{ matrix.image }}" \
            sh /source/packaging/install/coexistence_container_test.sh

  workload-drift:
    name: Refuse Docker workload drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect a deliberate container restart
        run: |
          docker run --rm --privileged \
            -e WARPMETAL_COEXISTENCE_EXPECT_DRIFT=1 \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            ubuntu:24.04 \
            sh /source/packaging/install/coexistence_container_test.sh
