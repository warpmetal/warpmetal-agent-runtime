name: Native package

# Reproducible WarpMetal-patched OpenCode package (custom version 2.0.14-wm.2).
# Every job fetches the exact official upstream revision into an isolated
# RUNNER_TEMP checkout and never builds from the Runtime repository checkout.
# PRs run lock closure, build, generated checks, affected tests and the
# authenticated binary smoke, then retain the assembled candidate.
#
# The exact custom tag publishes normally. A bounded workflow_dispatch with the
# single closed choice release_tag=opencode-v2.0.14-wm.2 recovers that same
# immutable tag from corrected main after a publication failure without moving
# the tag. Signed assets are retained before publication. Existing releases are
# refused, never overwritten; --latest is never moved and Runtime v* releases,
# npm, or official upstream repositories are never touched.

on:
  pull_request:
    paths:
      - "packaging/native/**"
      - ".github/workflows/native-build.yml"
  push:
    tags:
      - "opencode-v2.0.14-wm.2"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable native package tag to publish"
        required: true
        type: choice
        options:
          - opencode-v2.0.14-wm.2

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Static closure checks
        run: |
          set -eu
          sh -n packaging/native/build.sh
          python3 -m py_compile packaging/native/smoke.py
          test -f packaging/native/upstream.lock.json
          test -f packaging/native/README.md
          python3 -c 'import json; json.load(open("packaging/native/upstream.lock.json"))'
      - name: Fetch exact official upstream revision
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" init --quiet
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/anomalyco/opencode.git
          git -C "$RUNNER_TEMP/upstream" fetch --quiet --depth=1 origin 08462140ec0de1e4b17d4a353d8d5827f53cf7b0
          git -C "$RUNNER_TEMP/upstream" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "08462140ec0de1e4b17d4a353d8d5827f53cf7b0"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse 'HEAD^{tree}')" = "9572aed1d292ca13d50e917d794bb0656db51efc"
      - name: Lock and patch closure (fails closed until the root seal)
        run: |
          set -eu
          packaging/native/build.sh verify \
            --lock packaging/native/upstream.lock.json \
            --source "$RUNNER_TEMP/upstream" \
            --patch packaging/native/warpmetal-atomic-input-v1.patch
      - name: Build, generation checks, affected tests and smoke
        run: |
          set -eu
          packaging/native/build.sh build \
            --lock packaging/native/upstream.lock.json \
            --source "$RUNNER_TEMP/upstream" \
            --patch packaging/native/warpmetal-atomic-input-v1.patch \
            --out "$RUNNER_TEMP/native-package" \
            --bun "$(command -v bun)" \
            --tests \
            --smoke
      - name: Retain assembled native candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64-candidate
          path: ${{ runner.temp }}/native-package/artifacts/*
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.5.3"
      - name: Assert exact immutable tag on main ancestry
        run: |
          set -eu
          test "$RELEASE_TAG" = "opencode-v2.0.14-wm.2"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Refuse an existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$RELEASE_TAG" = "opencode-v2.0.14-wm.2"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "native-release: $RELEASE_TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
      - name: Fetch exact official upstream revision
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" init --quiet
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/anomalyco/opencode.git
          git -C "$RUNNER_TEMP/upstream" fetch --quiet --depth=1 origin 08462140ec0de1e4b17d4a353d8d5827f53cf7b0
          git -C "$RUNNER_TEMP/upstream" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "08462140ec0de1e4b17d4a353d8d5827f53cf7b0"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse 'HEAD^{tree}')" = "9572aed1d292ca13d50e917d794bb0656db51efc"
      - name: Build, generation checks, smoke, checksums and provenance
        run: |
          set -eu
          packaging/native/build.sh build \
            --lock packaging/native/upstream.lock.json \
            --source "$RUNNER_TEMP/upstream" \
            --patch packaging/native/warpmetal-atomic-input-v1.patch \
            --out "$RUNNER_TEMP/native-package" \
            --bun "$(command -v bun)" \
            --smoke
          cd "$RUNNER_TEMP/native-package/artifacts"
          test -f opencode-cli-linux-x64-2.0.14-wm.2.tgz
          test -f opencode-cli-linux-x64-2.0.14-wm.2.tgz.sha256
          test -f opencode.binary.sha256
          python3 - <<'PY'
          import json
          d = json.load(open("warpmetal-native-provenance.json"))
          assert set(d) == {"builder", "buildType", "invocation", "materials", "metadata"}, sorted(d)
          assert d["builder"].get("id")
          assert isinstance(d["buildType"], str) and d["buildType"]
          parameters = d["invocation"]["parameters"]
          assert parameters["sourceRevision"] == "08462140ec0de1e4b17d4a353d8d5827f53cf7b0"
          assert parameters["sourceTree"] == "9572aed1d292ca13d50e917d794bb0656db51efc"
          assert parameters["patchDigest"].startswith("sha256:")
          assert parameters["artifactSha256"].startswith("sha256:")
          assert parameters["binarySha256"].startswith("sha256:")
          assert d["metadata"]["reproducible"] is False
          PY
      - name: Keyless cosign bundle and SLSA provenance
        run: |
          set -eu
          cd "$RUNNER_TEMP/native-package/artifacts"
          archive=opencode-cli-linux-x64-2.0.14-wm.2.tgz
          cosign sign-blob --yes --bundle "$archive.cosign.bundle" "$archive"
          cosign attest-blob --yes --type slsaprovenance \
            --predicate warpmetal-native-provenance.json \
            --bundle "$archive.attestation.bundle" "$archive"
          test -s "$archive.cosign.bundle"
          test -s "$archive.attestation.bundle"
      - name: Retain signed assets before publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-signed-linux-x64
          path: |
            ${{ runner.temp }}/native-package/artifacts/opencode-cli-linux-x64-2.0.14-wm.2.tgz
            ${{ runner.temp }}/native-package/artifacts/opencode-cli-linux-x64-2.0.14-wm.2.tgz.sha256
            ${{ runner.temp }}/native-package/artifacts/opencode.binary.sha256
            ${{ runner.temp }}/native-package/artifacts/warpmetal-native-provenance.json
            ${{ runner.temp }}/native-package/artifacts/opencode-cli-linux-x64-2.0.14-wm.2.tgz.cosign.bundle
            ${{ runner.temp }}/native-package/artifacts/opencode-cli-linux-x64-2.0.14-wm.2.tgz.attestation.bundle
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Publish immutable release for the custom tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/native-package/artifacts"
          archive=opencode-cli-linux-x64-2.0.14-wm.2.tgz
          cat > RELEASE_NOTES.md <<'EOF'
          WarpMetal-patched OpenCode package (custom identity, not an upstream release).

          - custom version: 2.0.14-wm.2
          - source: official OpenCode 08462140ec0de1e4b17d4a353d8d5827f53cf7b0
          - archive: package/bin/opencode npm layout
          - verification: sha256 checksums, keyless cosign OIDC blob bundle and SLSA v0.2 provenance
          EOF
          gh release create "$RELEASE_TAG" \
            "$archive" \
            "$archive.sha256" \
            opencode.binary.sha256 \
            warpmetal-native-provenance.json \
            "$archive.cosign.bundle" \
            "$archive.attestation.bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --latest=false \
            --notes-file RELEASE_NOTES.md
