name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - name: Verify and test release source
        run: |
          set -eu
          test -z "$(gofmt -l .)"
          sh -n packaging/install/install.sh
          go test -race ./...
          go vet ./...

  build:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.5.3"
      - name: Build and sign static release bundle
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          COSIGN_PASSWORD: ${{ secrets.AGENT_RUNTIME_COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.AGENT_RUNTIME_COSIGN_PRIVATE_KEY }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stage="dist/warpmetal-runtime-${version}-linux-${GOARCH}"
          archive="$(basename "$stage").tar.gz"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$stage/warpmetald" ./cmd/warpmetald
          go build -trimpath -ldflags "-s -w" -o "$stage/warpmetal-agentctl" ./cmd/warpmetal-agentctl
          go build -trimpath -ldflags "-s -w" -o "$stage/warpmetal-sandbox-gateway" ./cmd/warpmetal-sandbox-gateway
          go build -trimpath -ldflags "-s -w" -o "$stage/warpmetal-sandbox-shell" ./cmd/warpmetal-sandbox-shell
          install -m 0755 packaging/install/install.sh "$stage/install.sh"
          install -m 0644 packaging/systemd/warpmetald.service "$stage/warpmetald.service"
          install -m 0644 packaging/sshd/warpmetal-sandbox.conf "$stage/warpmetal-sandbox.conf"
          tar -C dist -czf "dist/${archive}" "$(basename "$stage")"
          (cd dist && sha256sum "$archive" > "${archive}.sha256")
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --output-signature "dist/${archive}.sig" "dist/${archive}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-runtime-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-runtime-*
          path: dist
          merge-multiple: true
      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
